upstream backend {
    server wake_tf_up_backend:8000;
}

upstream frontend {
    server wake_tf_up_frontend:80;
}

server {
    listen 80 default_server;
    server_name wake-tf-up.eu www.wake-tf-up.eu localhost _;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HSTS. Safe to send unconditionally even though this nginx only ever
    # sees plain HTTP internally (TLS is terminated in front of this stack,
    # per confirmation that production is served over HTTPS) — browsers
    # only honor Strict-Transport-Security when the connection they made
    # was actually HTTPS, so this is inert for anyone reaching this nginx
    # directly over HTTP and effective for real HTTPS visitors.
    # NOT adding an HTTP->HTTPS redirect at this layer: since TLS terminates
    # upstream, every request arrives here as HTTP regardless of what the
    # visitor used, and redirecting based on a guessed X-Forwarded-Proto
    # convention risks a redirect loop if it doesn't match what the actual
    # terminator sets. That redirect belongs at the TLS-terminating layer,
    # which almost certainly already does it.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Content-Security-Policy scoped to what this app actually loads:
    # same-origin app/API/media (apiBaseUrl is same-origin in production),
    # plus the embedded Packeta pickup-point widget. GoPay is a full-page
    # redirect (window.location.href), not an in-page request, so it does
    # not need to appear here. Verify the Packeta pickup-point picker still
    # works after deploying this — widget.packeta.com may call additional
    # packeta.com/zasilkovna.cz subdomains for map tiles/pickup-point data
    # that aren't exercised by a quick smoke test.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://widget.packeta.com https://*.packeta.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://widget.packeta.com https://*.packeta.com https://*.zasilkovna.cz; font-src 'self' data:; connect-src 'self' https://widget.packeta.com https://*.packeta.com https://*.zasilkovna.cz; frame-src https://widget.packeta.com https://*.packeta.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none';" always;

    # Backend API routes
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        limit_conn conn_limit 50;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        # Timeout settings for slow queries
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Django admin — was completely unprotected here; admin changelist
    # views are DB-heavy, and DRF's throttling doesn't cover this path.
    location /admin/ {
        limit_req zone=admin_limit burst=20 nodelay;
        limit_conn conn_limit 10;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        # Timeout settings
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Media files (user uploads)
    location /media/ {
        limit_req zone=general_limit burst=50 nodelay;
        limit_conn conn_limit 50;
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Static files (admin, etc.)
    location /static/ {
        limit_req zone=general_limit burst=50 nodelay;
        limit_conn conn_limit 50;
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Frontend Angular application
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
