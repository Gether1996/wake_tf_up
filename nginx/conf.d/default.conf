upstream backend {
    server wake_tf_up_backend:8000;
}

upstream frontend {
    server wake_tf_up_frontend:80;
}

server {
    listen 80 default_server;
    server_name wake-tf-up.eu www.wake-tf-up.eu localhost _;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content-Security-Policy scoped to what this app actually loads:
    # same-origin app/API/media (apiBaseUrl is same-origin in production),
    # plus the embedded Packeta pickup-point widget. GoPay is a full-page
    # redirect (window.location.href), not an in-page request, so it does
    # not need to appear here. Verify the Packeta pickup-point picker still
    # works after deploying this — widget.packeta.com may call additional
    # packeta.com/zasilkovna.cz subdomains for map tiles/pickup-point data
    # that aren't exercised by a quick smoke test.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://widget.packeta.com https://*.packeta.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://widget.packeta.com https://*.packeta.com https://*.zasilkovna.cz; font-src 'self' data:; connect-src 'self' https://widget.packeta.com https://*.packeta.com https://*.zasilkovna.cz; frame-src https://widget.packeta.com https://*.packeta.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none';" always;

    # Backend API routes
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        # Timeout settings for slow queries
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Django admin
    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        # Timeout settings
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Media files (user uploads)
    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Static files (admin, etc.)
    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Frontend Angular application
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
