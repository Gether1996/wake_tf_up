user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    # Matches Django's DATA_UPLOAD_MAX_MEMORY_SIZE so oversized uploads are
    # rejected here instead of after the backend buffers them into memory.
    client_max_body_size 50M;

    # Rate limiting zones - relaxed for better UX during page refreshes
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=100r/s;
    # Django admin is expensive per-request (heavy querysets, no DRF
    # throttling) and was previously unprotected at this layer.
    limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=10r/s;

    # Per-IP concurrent connection cap — mitigates slow-loris style attacks
    # (many held-open connections) that a request-rate limit alone doesn't
    # catch, especially combined with gunicorn's 120s proxy timeout.
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
