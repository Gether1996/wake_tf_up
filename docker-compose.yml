services:
  backend:
    build:
      context: ./backend_django
    container_name: wake_tf_up_backend
    volumes:
      - ./backend_django/wake_tf_up/media:/app/wake_tf_up/media
      - ./backend_django/wake_tf_up/staticfiles:/app/wake_tf_up/staticfiles
    expose:
      - "8000"
    env_file:
      - ./backend_django/.env
    networks:
      - wake_tf_up_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend_angular
      dockerfile: Dockerfile.prod
    container_name: wake_tf_up_frontend
    expose:
      - "80"
    networks:
      - wake_tf_up_network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: wake_tf_up_nginx
    ports:
      - "9006:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./backend_django/wake_tf_up/media:/app/media:ro
      - ./backend_django/wake_tf_up/staticfiles:/app/static:ro
    depends_on:
      - backend
      - frontend
    networks:
      - wake_tf_up_network
    restart: unless-stopped

networks:
  wake_tf_up_network:
    driver: bridge
